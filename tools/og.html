.grid{position:absolute;inset:0;background:linear-gradient(#ffffff08 1px,transparent 1px) 0 0/100% 8px}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;filter:blur(120px);opacity:.28}

.field{position:absolute;right:60px;top:50px;width:340px;height:530px;background:#101520;border:6px solid #323747;display:flex;box-shadow:0 0 0 6px #060607}
.lane{flex:1;position:relative;border-right:3px solid #1d2331}.lane:last-child{border:0}
.n{position:absolute;left:8px;right:8px;height:54px;border-radius:2px;box-shadow:inset 0 14px 0 #ffffff38,0 6px 0 #00000070}
.hit{position:absolute;left:0;right:0;bottom:70px;height:6px;background:#f4f4e9;opacity:.8}
